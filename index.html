<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172b" />

    <!-- Default manifest. src/lib/pwa.ts swaps this per route, so installing
         from inside a tool installs that tool as its own app. -->
    <link rel="manifest" href="/pwa/dash.webmanifest" />
    <link rel="apple-touch-icon" href="/pwa/dash-icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="zimadash" />

    <title>zimadash</title>
    <script>
      // Applied before first paint so the wall display never flashes the wrong
      // theme. Only 'light' and 'dark' are ever stored — anything else, including
      // no key at all, means follow the OS.
      try {
        var stored = localStorage.getItem('zimadash.theme')
        var dark =
          stored === 'dark' ||
          (stored !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
